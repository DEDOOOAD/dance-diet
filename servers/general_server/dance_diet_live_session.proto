syntax = "proto3";

package dance_diet.live.v1;

service DanceDietLiveSessionService {
  rpc StartLiveSession (LiveSessionStartRequest) 
              returns (LiveSessionStartResponse);
  rpc StreamLiveSession (stream LiveSessionClientEvent) 
              returns (stream LiveSessionServerEvent);
  rpc EndLiveSession (LiveSessionEndRequest) 
              returns (LiveSessionEndResponse);
}

message LiveSessionStartRequest {
  string user_id = 1;
  string dance_type = 2;
  string content_id = 3;
}

message LiveSessionStartResponse {
  string session_id = 1;
  string user_id = 2;
  string status = 3;
  string started_at = 4;
  string grpc_target = 5;
  string stream_method = 6;
  string dance_type = 7;
  string content_id = 8;
}

message LiveSessionEndRequest {
  string session_id = 1;
}

message LiveSessionEndResponse {
  string session_id = 1;
  string status = 2;
  string ended_at = 3;
  int32 total_frames = 4;
  double elapsed_seconds = 5;
  double total_calories = 6;
  string message = 7;
}

enum ClientEventType {
  CLIENT_EVENT_TYPE_UNSPECIFIED = 0;
  CLIENT_EVENT_SESSION_JOIN = 1;
  CLIENT_EVENT_FRAME = 2;
  CLIENT_EVENT_PING = 3;
  CLIENT_EVENT_STREAM_CLOSE = 4;
}

message SessionJoinRequest {
  string session_id = 1;
}

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_JPEG = 1;
  IMAGE_FORMAT_PNG = 2;
  IMAGE_FORMAT_JPG = 3;
  IMAGE_FORMAT_BMP = 4;
  IMAGE_FORMAT_WEBP = 5;
}

message FrameUploadRequest {
  string session_id = 1;
  int32 frame_index = 2;
  int64 timestamp_ms = 3;
  bytes frame_bytes = 4;
  ImageFormat image_format = 5;
}

message PingRequest {
  string session_id = 1;
}

message StreamCloseRequest {
  string session_id = 1;
  string reason = 2;
}

message LiveSessionClientEvent {
  ClientEventType event_type = 1;
  int64 sent_at_ms = 2;

  oneof payload {
    SessionJoinRequest join = 10;
    FrameUploadRequest frame = 11;
    PingRequest ping = 12;
    StreamCloseRequest close = 13;
  }
}

enum ServerEventType {
  SERVER_EVENT_TYPE_UNSPECIFIED = 0;
  SERVER_EVENT_SESSION_READY = 1;
  SERVER_EVENT_FRAME_ACK = 2;
  SERVER_EVENT_PONG = 3;
  SERVER_EVENT_WARNING = 4;
  SERVER_EVENT_SESSION_ENDED = 5;
}

message LiveSessionServerEvent {
  ServerEventType event_type = 1;
  string type = 2;
  string session_id = 3;
  int32 frame_index = 4;
  int32 total_frames = 5;
  double elapsed_seconds = 6;
  double total_calories = 7;
  string status = 8;
  string message = 9;
  string emitted_at = 10;
  string grpc_target = 11;
  string stream_method = 12;
  string dance_type = 13;
  string content_id = 14;
  int64 source_timestamp_ms = 15;
  ImageFormat image_format = 16;
  int32 frame_byte_size = 17;
}
