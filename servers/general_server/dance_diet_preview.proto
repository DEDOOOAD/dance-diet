syntax = "proto3";

package dance_diet.preview.v1;

service DanceDietPreviewService {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc SubmitPoseFrame (PoseFrameRequest) returns (PoseFrameResponse);
}

message PingRequest {
  string client_name = 1;
  string message = 2;
}

message PingResponse {
  bool ok = 1;
  string reply = 2;
  string server_time = 3;
  string service_version = 4;
}

message Landmark {
  float x = 1;
  float y = 2;
  float z = 3;
  float visibility = 4;
}

message PoseFrameRequest {
  string session_id = 1;
  int32 frame_index = 2;
  int64 timestamp_ms = 3;
  repeated Landmark landmarks = 4;
}

message PoseFrameResponse {
  bool ok = 1;
  int32 received_landmark_count = 2;
  string note = 3;
  string received_at = 4;
}
